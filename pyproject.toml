[project]
name = "petrogis"
version = "0.1.0"
description = "Domain-focused desktop GIS for petroleum engineering and reservoir geology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "rasterio>=1.4",
    "lasio>=0.31",
    "openpyxl>=3.1",
    "pyarrow>=17",
]

[project.scripts]
petrogis = "petrogis.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petrogis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "BLE", "PERF", "NPY"]
ignore = ["ANN401"]
# En dashes are intentional in user-facing strings (e.g. "Style – Layer", "2–98%").
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
