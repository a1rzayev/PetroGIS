[project]
name = "petrogis"
version = "0.1.0"
description = "Domain-focused desktop GIS for petroleum engineering and reservoir geology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "rasterio>=1.4",
    "lasio>=0.31",
    "openpyxl>=3.1",
    "pyarrow>=17",
]

[project.scripts]
petrogis = "petrogis.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petrogis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# S = flake8-bandit security rules (security baseline, docs/phase2-plan.md).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "BLE", "PERF", "NPY", "S"]
ignore = ["ANN401"]
# En dashes are intentional in user-facing strings (e.g. "Style – Layer", "2–98%").
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts (S101) and run the interpreter itself in a subprocess (S603).
"tests/**" = ["ANN", "S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
markers = [
    "perf: timing test with a budget; run without coverage instrumentation (CI runs them separately)",
]

[tool.pyright]
# Strict typing on the Qt-free layers (quality gates, docs/phase2-plan.md). Runs in CI.
include = ["src/petrogis/core", "src/petrogis/io"]
strict = ["src/petrogis/core", "src/petrogis/io"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# pandas/geopandas/rasterio are largely untyped; these checks would only report library noise.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
