# Continuous integration: lint, tests (with coverage gate), speed budgets, types, dependency audit.
#
# Hardening (security baseline, docs/phase2-plan.md):
# - Actions are pinned to full commit SHAs; the tag is in the trailing comment.
# - The token is read-only, and checkout does not persist credentials.
# - Only push and pull_request triggers: never pull_request_target, so untrusted fork code never
#   runs with secrets or a write token.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: uv sync --locked
      - name: Tests with coverage gate on core/ and io/
        run: >
          uv run pytest -m "not perf"
          --cov=petrogis.core --cov=petrogis.io --cov-fail-under=90
      - name: Speed budgets (uninstrumented)
        run: uv run pytest -m perf

  types:
    # Pyright strict on core/ and io/. Not blocking until the first run's findings are fixed;
    # tracked in ROADMAP.md (P2.0). Runs only in CI because the download stalls locally.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run --with pyright==1.1.414 pyright

  audit:
    # Known-vulnerability check of every locked dependency, by hash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv export --locked --format requirements-txt --no-emit-project > requirements-audit.txt
      - run: uvx pip-audit==2.7.3 --requirement requirements-audit.txt --require-hashes --disable-pip
